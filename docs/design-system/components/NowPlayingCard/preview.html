<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
  .wrap { max-width: 360px; padding: var(--space-4); display: grid; gap: var(--space-3); }
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  .head .meta { color: var(--muted); }
  .card { background: var(--surface); border-radius: var(--radius-lg); padding: var(--space-3); display: grid; grid-template-columns: var(--size-poster-hero) minmax(0, 1fr); gap: 14px; }
  .poster { border-radius: var(--radius-md); overflow: hidden; line-height: 0; }
  .poster svg { width: 100%; height: auto; }
  .body { display: grid; gap: 6px; align-content: center; min-width: 0; }
  .sub { color: var(--muted); }
  .bar { height: 4px; border-radius: var(--radius-pill); background: var(--surface-2); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty { background: var(--surface); border-radius: var(--radius-lg); padding: var(--space-4); }
</style>
<div class="wrap">
  <div class="head"><span class="body-strong">Acum pe TV</span><span class="meta">Samsung TV, sufragerie</span></div>
  <div class="card">
    <div class="poster"><svg viewBox="0 0 100 150" role="img" aria-label="Poster The Godfather"><defs><linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B0A09"/><stop offset="1" stop-color="#3A2A1A"/></linearGradient></defs><rect width="100" height="150" fill="url(#p)"/><circle cx="50" cy="56" r="22" fill="#E8DCC4" opacity=".14"/><text x="50" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#E8DCC4">THE</text><text x="50" y="134" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#E8DCC4">GODFATHER</text></svg></div>
    <div class="body">
      <span class="title-card">The Godfather</span>
      <span class="meta sub">1972, redare directă</span>
      <div class="bar" role="progressbar" aria-valuenow="41" aria-valuemin="0" aria-valuemax="100"><i style="width:41%"></i></div>
      <div class="times data"><span>1:12:40</span><span>2:57:04</span></div>
    </div>
  </div>
  <div class="empty body">Nimic pe TV acum.</div>
</div>
