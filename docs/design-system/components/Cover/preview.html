<!-- @dsCard height=300 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  html, body { margin: 0; }
  .cover { position: relative; width: 960px; height: 300px; background: var(--bg); overflow: hidden; font-family: var(--font-sans); }
  .art { position: absolute; left: 480px; top: 0; width: 480px; height: 300px; }
  .accent { fill: var(--accent); }
  .surface2 { fill: var(--surface-2); }
  .ink { fill: var(--ink); }
  .ok { fill: var(--ok); }
  .danger { fill: var(--danger); }
  .tile-lg { rx: var(--radius-lg); }
  .poster { rx: var(--radius-sm); }
  .text { position: absolute; left: 56px; bottom: 40px; max-width: 440px; display: grid; gap: 16px; }
  .name { margin: 0; font-size: 112px; line-height: 0.95; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
  .tag { margin: 0; font-size: 14px; line-height: 20px; color: var(--muted); }
</style>
<div class="cover">
  <svg class="art" viewBox="0 0 480 300" aria-hidden="true">
    <!-- blocks: accent 160x300 slab (bleeds top and bottom); surface-2 304x132 at radius-lg; ink, ok, danger only as single poster tiles. -->
    <!-- arrangement: one tall amber slab with a dark block beside it, posters below, like the Acasă screen (hero card, then a grid). -->
    <!-- pattern: 2:3 poster tiles (48x72) cut at radius-sm, because the system is poster-led: movies come first, the controls second. -->
    <!-- steps and radii: gap space-3 (12), tile 48 = space-4 x 3, rows 72 = 48 x 1.5; radius-lg 18 on the block, radius-sm 8 on posters. -->
    <rect class="accent" x="0" y="0" width="160" height="300"/>
    <rect class="surface2 tile-lg" x="176" y="0" width="304" height="132"/>
    <rect class="surface2 poster" x="176" y="148" width="48" height="72"/>
    <rect class="ink poster" x="236" y="148" width="48" height="72"/>
    <rect class="surface2 poster" x="296" y="148" width="48" height="72"/>
    <rect class="surface2 poster" x="356" y="148" width="48" height="72"/>
    <rect class="surface2 poster" x="416" y="148" width="48" height="72"/>
    <rect class="surface2 poster" x="176" y="232" width="48" height="72"/>
    <rect class="surface2 poster" x="236" y="232" width="48" height="72"/>
    <rect class="ok poster" x="296" y="232" width="48" height="72"/>
    <rect class="surface2 poster" x="356" y="232" width="48" height="72"/>
    <rect class="danger poster" x="416" y="232" width="48" height="72"/>
  </svg>
  <div class="text">
    <p class="name">Plex<br>Couch</p>
    <p class="tag">Telecomanda de pe telefon pentru seara de film.</p>
  </div>
</div>
