<!-- @dsCard group="Media" height=290 subtitle="RO, missing RO, waiting" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
  .grid { max-width: 320px; padding: var(--space-4); display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3) var(--space-2); }
  .card { display: grid; gap: 6px; }
  .poster { position: relative; border-radius: var(--radius-sm); overflow: hidden; line-height: 0; }
  .poster svg { width: 100%; height: auto; }
  .badge-tag { position: absolute; left: 5px; bottom: 5px; padding: 2px 6px; border-radius: var(--radius-xs); background: rgba(15, 18, 23, 0.82); color: var(--ink); line-height: 14px; }
  .badge-tag.miss { color: var(--accent); }
  .t { font-weight: 600; color: var(--ink); }
  .s { color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
<div class="grid" id="g"></div>
<script>
  var items = [
    { t: 'The Godfather', s: '19,0 GB', a: '#0B0A09', b: '#3A2A1A', ink: '#E8DCC4', badge: 'RO' },
    { t: 'Past Lives', s: '14,2 GB', a: '#2E4A66', b: '#B9C6D2', ink: '#0F1B27', badge: 'fără RO' },
    { t: 'The Odyssey', s: 'Apare digital pe 17 nov', a: '#0D2233', b: '#5E7F86', ink: '#EAF1F2', badge: '' }
  ];
  document.getElementById('g').innerHTML = items.map(function (m, i) {
    var badge = m.badge ? '<span class="badge-tag badge' + (m.badge === 'RO' ? '' : ' miss') + '">' + m.badge + '</span>' : '';
    return '<div class="card"><div class="poster"><svg viewBox="0 0 100 150" role="img" aria-label="Poster ' + m.t + '"><defs><linearGradient id="g' + i + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + m.a + '"/><stop offset="1" stop-color="' + m.b + '"/></linearGradient></defs><rect width="100" height="150" fill="url(#g' + i + ')"/><circle cx="50" cy="56" r="22" fill="' + m.ink + '" opacity=".14"/></svg>' + badge + '</div><span class="t data">' + m.t + '</span><span class="s data">' + m.s + '</span></div>';
  }).join('');
</script>
