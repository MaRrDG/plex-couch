<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1217">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
  <meta name="application-name" content="{{APP_NAME}}">
  <title>{{APP_NAME}}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/figtree-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <!-- Login: PinPad -->
  <main id="login" class="login" hidden>
    <div class="login-head">
      <h1 class="title-screen">{{APP_NAME}}</h1>
      <p class="meta login-sub">Introdu PIN-ul</p>
      <div class="pin-dots" id="pin-dots" role="img" aria-label="0 din 6 cifre">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <p class="meta login-msg" id="login-msg" role="alert"></p>
    </div>
    <div class="keypad" id="keypad" role="group" aria-label="Tastatură PIN">
      <button type="button" class="key" data-k="1">1</button>
      <button type="button" class="key" data-k="2">2</button>
      <button type="button" class="key" data-k="3">3</button>
      <button type="button" class="key" data-k="4">4</button>
      <button type="button" class="key" data-k="5">5</button>
      <button type="button" class="key" data-k="6">6</button>
      <button type="button" class="key" data-k="7">7</button>
      <button type="button" class="key" data-k="8">8</button>
      <button type="button" class="key" data-k="9">9</button>
      <button type="button" class="key key-text" data-k="ok" id="key-ok" hidden>Intră</button>
      <span class="key-gap" id="key-gap" aria-hidden="true"></span>
      <button type="button" class="key" data-k="0">0</button>
      <button type="button" class="key key-text" data-k="del" id="key-del" aria-label="Șterge o cifră">Șterge</button>
    </div>
  </main>

  <!-- App -->
  <div id="app" class="app" hidden>
    <main class="screen" id="screen">
      <div class="banner banner-offline" id="offline" role="status" hidden>
        <i class="dot dot-danger" aria-hidden="true"></i>
        <p class="body">PC-ul nu răspunde. Verifică dacă e pornit.</p>
      </div>

      <section class="banner countdown-banner" id="countdown" role="status" aria-live="off" hidden>
        <div class="countdown-line">
          <span class="body-strong" id="countdown-label">PC-ul se oprește în</span>
          <span class="countdown" id="countdown-secs"></span>
        </div>
        <div class="bar bar-danger" aria-hidden="true"><i id="countdown-bar"></i></div>
        <button type="button" class="btn btn-primary" id="countdown-cancel">Anulează oprirea</button>
      </section>

      <!-- Acasă -->
      <section class="view" id="view-acasa" data-view="acasa" aria-labelledby="t-acasa">
        <h1 class="title-screen" id="t-acasa">Acasă</h1>

        <section class="sec" aria-labelledby="h-playing">
          <div class="sec-head">
            <h2 class="body-strong" id="h-playing">Acum pe TV</h2>
            <span class="meta muted" id="playing-device"></span>
          </div>
          <div class="sec-body" id="playing"></div>
        </section>

        <div class="tiles">
          <button type="button" class="tile" id="mon-off" data-icon="moff">
            <span class="tile-label">Stinge monitoarele</span>
          </button>
          <button type="button" class="tile" id="mon-on" data-icon="mon">
            <span class="tile-label">Aprinde monitoarele</span>
          </button>
          <button type="button" class="tile" id="auto-off" data-icon="auto" aria-pressed="false">
            <span class="tile-label">Stinge la play<span class="tile-state meta" id="auto-off-state">Oprit</span></span>
          </button>
          <button type="button" class="tile tile-danger" id="tile-shutdown" data-icon="power">
            <span class="tile-label">Oprește PC-ul<span class="tile-state meta">în 60 de secunde</span></span>
          </button>
        </div>

        <section class="sec" id="sec-download" aria-labelledby="h-download" hidden>
          <div class="sec-head">
            <h2 class="body-strong" id="h-download">Se descarcă</h2>
            <span class="meta muted" id="download-meta"></span>
          </div>
          <div class="sec-body" id="download"></div>
        </section>
      </section>

      <!-- Filme -->
      <section class="view" id="view-filme" data-view="filme" aria-labelledby="t-filme" hidden>
        <h1 class="title-screen" id="t-filme">Filme</h1>
        <div class="seg" role="tablist" aria-label="Filme" id="seg">
          <button type="button" role="tab" id="seg-lib" aria-selected="true" aria-controls="panel-lib">Bibliotecă</button>
          <button type="button" role="tab" id="seg-next" aria-selected="false" aria-controls="panel-next" tabindex="-1">Urmează</button>
        </div>
        <div role="tabpanel" id="panel-lib" aria-labelledby="seg-lib"></div>
        <div role="tabpanel" id="panel-next" aria-labelledby="seg-next" hidden></div>
      </section>

      <!-- PC -->
      <section class="view" id="view-pc" data-view="pc" aria-labelledby="t-pc" hidden>
        <h1 class="title-screen" id="t-pc">PC</h1>

        <section class="sec" aria-labelledby="h-seed">
          <div class="sec-head">
            <h2 class="body-strong" id="h-seed">Seed FileList</h2>
            <span class="meta muted">ratio 1 sau 48 h</span>
          </div>
          <div class="sec-body" id="seed"></div>
        </section>

        <section class="sec" aria-labelledby="h-disk">
          <div class="sec-head">
            <h2 class="body-strong" id="h-disk">Spațiu pe D:</h2>
            <span class="meta muted" id="disk-meta"></span>
          </div>
          <div class="sec-body" id="disk"></div>
        </section>

        <section class="sec" aria-labelledby="h-services">
          <div class="sec-head">
            <h2 class="body-strong" id="h-services">Servicii</h2>
            <span class="meta muted" id="services-meta"></span>
          </div>
          <div class="chips" id="services"></div>
        </section>

        <div class="actions">
          <button type="button" class="btn btn-danger" id="btn-shutdown">Oprește PC-ul</button>
          <button type="button" class="btn btn-plain" id="btn-restart">Repornește</button>
        </div>

        <footer class="foot">
          <p class="meta muted" id="updated"></p>
          <p class="meta muted" id="pc-line" hidden></p>
          <button type="button" class="btn-text body-strong" id="logout">Ieși din cont</button>
        </footer>
      </section>
    </main>

    <nav class="tabbar" aria-label="Navigare">
      <div class="tabbar-inner">
        <a href="#acasa" data-tab="acasa" data-icon="home"><span class="tab">Acasă</span></a>
        <a href="#filme" data-tab="filme" data-icon="film"><span class="tab">Filme</span></a>
        <a href="#pc" data-tab="pc" data-icon="pc"><span class="tab">PC</span></a>
      </div>
    </nav>
  </div>

  <!-- ActionSheet -->
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-describedby="sheet-text" hidden>
    <span class="grab" aria-hidden="true"></span>
    <h2 class="title-card" id="sheet-title" tabindex="-1"></h2>
    <p class="body" id="sheet-text"></p>
    <div class="sheet-warn" id="sheet-warn" hidden>
      <p class="body warn-text" id="sheet-warn-text"></p>
      <ul class="warn-list" id="sheet-warn-list"></ul>
    </div>
    <button type="button" class="btn btn-confirm" id="sheet-confirm"></button>
    <button type="button" class="btn btn-plain btn-on-surface" id="sheet-cancel">Anulează</button>
  </div>

  <div class="toast-wrap" aria-live="polite">
    <div class="toast body" id="toast" role="status" hidden></div>
  </div>
</body>
</html>
